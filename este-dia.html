<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Este día en la historia — El Monumento</title>
<link rel="stylesheet" href="assets/css/museo.css">
<link rel="stylesheet" href="assets/css/este-dia.css">
<script src="data/meta.js"></script>
<script src="data/efemerides.js"></script>
<script src="data/jugadores.js"></script>
<script src="assets/js/comun.js"></script>
</head>
<body>
<!-- comun.js inserta la cabecera con navegación y botón de tema al cargar -->
<main>
  <section class="sala-cabeza"><div class="contenedor">
    <p class="sobre">Sala 4</p>
    <h1>Este día en la historia</h1>
    <p class="intro">Lo que pasó con los Yankees en cada fecha del calendario: títulos, juegos sin hit, debuts, nacimientos y el récord histórico del club ese día.</p>
  </div></section>

  <!-- Navegación por fecha: flechas y selector de mes + día. El hash #MM-DD enlaza a una fecha. -->
  <section class="seccion fecha-nav-seccion"><div class="contenedor">
    <nav class="fecha-nav" aria-label="Elegir fecha">
      <button class="boton" type="button" id="dia-anterior" aria-label="Día anterior">&larr; <span class="fecha-nav-txt">Anterior</span></button>
      <div class="fecha-selector">
        <label class="sr-solo" for="sel-mes">Mes</label>
        <select class="campo" id="sel-mes"></select>
        <label class="sr-solo" for="sel-dia">Día</label>
        <select class="campo" id="sel-dia"></select>
        <button class="boton" type="button" id="ir-hoy">Hoy</button>
      </div>
      <button class="boton" type="button" id="dia-siguiente" aria-label="Día siguiente"><span class="fecha-nav-txt">Siguiente</span> &rarr;</button>
    </nav>
  </div></section>

  <!-- Contenido de la fecha elegida (lo llena este-dia.js) -->
  <section class="seccion" id="dia"><div class="contenedor">
    <p class="etiqueta-sobre" id="dia-sobre"></p>
    <h2 id="dia-titulo"></h2>
    <p class="dia-record" id="dia-record"></p>
    <article class="destacado" id="destacado"></article>
    <div id="lista"></div>
    <details class="tambien" id="tambien"></details>
  </div></section>

  <!-- Sección fija: los juegos sin hit de los Yankees -->
  <section class="seccion" id="sin-hit"><div class="contenedor">
    <p class="etiqueta-sobre">Sección permanente</p>
    <h2>Los juegos sin hit de los Yankees</h2>
    <p class="peq" id="sin-hit-resumen"></p>
    <div class="tabla-scroll">
      <table class="tabla" id="tabla-sin-hit">
        <thead><tr>
          <th>Fecha</th><th>Pitcher</th><th>Rival</th><th class="num">Marcador</th><th class="num">Ponches</th><th>Perfecto</th><th>Contexto</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div></section>
</main>
<script src="assets/js/este-dia.js"></script>
</body>
</html>
